spring.application.name=club-isi

#------- web server configuration ----
server.servlet.context-path=/isi-clubs
server.port=8082
#------- swagger configuration ----
springdoc.swagger-ui.path=/docs
#--- swagger web page : http://localhost:8082/isi-clubs/docs

#--- database configuration for mysql server ----
spring.datasource.url=jdbc:mysql://localhost:3306/club?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#--- hibernate configuration ----
#--- hibernate ddl-auto (create X, create-drop X, validate, update, none)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect



